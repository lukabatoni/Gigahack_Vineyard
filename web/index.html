<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vineyard AI — Field Map</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <h1>Vineyard AI</h1>
    <p class="sub">Field map · EPSG:32635 → WGS84</p>

    <section>
      <h2>Layers</h2>
      <div id="layer-toggles"></div>
    </section>

    <section>
      <h2>Filter</h2>
      <div class="field">Vineyard (block)
        <div class="dd" id="dd-block"><button type="button" class="dd-btn">All</button><div class="dd-menu"></div></div>
      </div>
      <div class="field">Row (row_id)
        <div class="dd" id="dd-row"><button type="button" class="dd-btn">All</button><div class="dd-menu"></div></div>
      </div>
    </section>

    <section>
      <h2>Measurements</h2>
      <table id="measurements"><tbody><tr><td>loading…</td></tr></tbody></table>
    </section>

    <section>
      <h2>Statistics</h2>
      <table id="stats"><tbody></tbody></table>
    </section>
  </div>

  <div id="map"></div>
  <div id="banner">No map data found in <code>data/</code>. Run <code>python3 pipeline/export_web_data.py</code> to generate it.</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
